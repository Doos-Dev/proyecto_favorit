<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Primer Mes ❤️</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="corazones"></div>

<div class="carta-overlay" id="cartaOverlay" onclick="cerrarCartaFuera(event)">
    <div class="carta-papel">
        <span class="carta-cerrar" onclick="cerrarCarta()">✕</span>
        <p>
            No fue la mejor manera, cuidate mucho
        </p>
        <p class="carta-firma">Att: Piero</p>
    </div>
</div>

<div class="contenedor">
    <div class="carta-icono" onclick="abrirCarta()" title="Abrir carta">💌</div>
    <h1>❤️ Feliz Primer Mes y dos días ❤️</h1>

    <p class="mensaje">
        El que tú llegaras alegro mi vida,
        ahora los 25 de cada mes tienen más sentido
        a tu lado
    </p>

    <h2>Tiempo juntos:</h2>

    <div id="contador"></div>
    <button class="btn-amor" onclick="sorpresa()">
    ✨ Abrir Mensaje ✨
</button>

<p id="mensajeSorpresa" style="display:none; margin-top:20px; font-size:22px;">
    Gracias por este primer junto ati mi amor ❤️
</p>

    <p class="firma">Te amo mucho 💌</p>
</div>
<script>

    function sorpresa(){
    document.getElementById("mensajeSorpresa").style.display = "block";
}

function abrirCarta(){
    document.getElementById("cartaOverlay").classList.add("activa");
}

function cerrarCarta(){
    document.getElementById("cartaOverlay").classList.remove("activa");
}

function cerrarCartaFuera(evento){
    if(evento.target.id === "cartaOverlay"){
        cerrarCarta();
    }
}

// Contador congelado: desde el 25 de enero 2026 18:27 hasta el 10 de julio 2026 1:47 pm
function actualizarContador() {
    const dias = 165;
    const horas = 19;
    const minutos = 20;
    const segundos = 0;

    document.getElementById("contador").innerHTML =
        dias + " días " +
        horas + " horas " +
        minutos + " minutos " +
        segundos + " segundos ❤️";
}

actualizarContador();

</script>

</body>
</html>
